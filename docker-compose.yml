services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-boulangerie}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me}
      POSTGRES_DB: ${POSTGRES_DB:-boulangerie}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-boulangerie} -d ${POSTGRES_DB:-boulangerie}",
        ]
      interval: 10s
      timeout: 5s
      retries: 5

  # Applique les migrations une fois (image complète + CLI Prisma) puis s'arrête.
  migrate:
    build:
      context: .
      target: builder
    command: ["node_modules/.bin/prisma", "migrate", "deploy"]
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-boulangerie}:${POSTGRES_PASSWORD:-change-me}@db:5432/${POSTGRES_DB:-boulangerie}?schema=public

  app:
    build:
      context: .
      args:
        NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL}
        NEXT_PUBLIC_WHATSAPP_ORDER_NUMBER: ${NEXT_PUBLIC_WHATSAPP_ORDER_NUMBER:-}
        NEXT_PUBLIC_TELEGRAM_ORDER_USERNAME: ${NEXT_PUBLIC_TELEGRAM_ORDER_USERNAME:-}
        NEXT_PUBLIC_FACEBOOK_URL: ${NEXT_PUBLIC_FACEBOOK_URL:-}
        NEXT_PUBLIC_INSTAGRAM_URL: ${NEXT_PUBLIC_INSTAGRAM_URL:-}
        NEXT_PUBLIC_TIKTOK_URL: ${NEXT_PUBLIC_TIKTOK_URL:-}
        NEXT_PUBLIC_TELEGRAM_URL: ${NEXT_PUBLIC_TELEGRAM_URL:-}
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    environment:
      # La base est jointe par le nom de service « db ».
      DATABASE_URL: postgresql://${POSTGRES_USER:-boulangerie}:${POSTGRES_PASSWORD:-change-me}@db:5432/${POSTGRES_DB:-boulangerie}?schema=public
      NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL}
      NEXT_PUBLIC_WHATSAPP_ORDER_NUMBER: ${NEXT_PUBLIC_WHATSAPP_ORDER_NUMBER:-}
      NEXT_PUBLIC_TELEGRAM_ORDER_USERNAME: ${NEXT_PUBLIC_TELEGRAM_ORDER_USERNAME:-}
      NEXT_PUBLIC_FACEBOOK_URL: ${NEXT_PUBLIC_FACEBOOK_URL:-}
      NEXT_PUBLIC_INSTAGRAM_URL: ${NEXT_PUBLIC_INSTAGRAM_URL:-}
      NEXT_PUBLIC_TIKTOK_URL: ${NEXT_PUBLIC_TIKTOK_URL:-}
      NEXT_PUBLIC_TELEGRAM_URL: ${NEXT_PUBLIC_TELEGRAM_URL:-}
      SESSION_SECRET: ${SESSION_SECRET}
      ADMIN_EMAILS: ${ADMIN_EMAILS}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      DEFAULT_RESTAURANT_SLUG: ${DEFAULT_RESTAURANT_SLUG:-boulangerie}
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-}
      STRIPE_CONNECT_COUNTRY: ${STRIPE_CONNECT_COUNTRY:-FR}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      EMAIL_FROM: ${EMAIL_FROM:-}
      TWILIO_ACCOUNT_SID: ${TWILIO_ACCOUNT_SID:-}
      TWILIO_AUTH_TOKEN: ${TWILIO_AUTH_TOKEN:-}
      TWILIO_SMS_FROM: ${TWILIO_SMS_FROM:-}
      TWILIO_WHATSAPP_FROM: ${TWILIO_WHATSAPP_FROM:-}
      WHATSAPP_ORDER_TO: ${WHATSAPP_ORDER_TO:-}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_ORDER_CHAT_ID: ${TELEGRAM_ORDER_CHAT_ID:-}
      CRON_SECRET: ${CRON_SECRET:-}
      UPSTASH_REDIS_REST_URL: ${UPSTASH_REDIS_REST_URL:-}
      UPSTASH_REDIS_REST_TOKEN: ${UPSTASH_REDIS_REST_TOKEN:-}
    ports:
      # VPS partagé : exposé uniquement en local (Nginx fait le reverse-proxy).
      # 3000 (autre site Next) et 3100 (restaurant lodene.cloud) déjà pris → 3200.
      - "127.0.0.1:3200:3000"

volumes:
  pgdata:
