services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-restaurant_turc}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD obligatoire dans .env}
      POSTGRES_DB: ${POSTGRES_DB:-restaurant_turc}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-restaurant_turc} -d ${POSTGRES_DB:-restaurant_turc}",
        ]
      interval: 10s
      timeout: 5s
      retries: 5

  # Applique les migrations une fois (image complète + CLI Prisma) puis s'arrête.
  migrate:
    build:
      context: .
      target: builder
    command: ["node_modules/.bin/prisma", "migrate", "deploy"]
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-restaurant_turc}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD obligatoire dans .env}@db:5432/${POSTGRES_DB:-restaurant_turc}?schema=public

  app:
    build:
      context: .
      args:
        NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:?NEXT_PUBLIC_SITE_URL obligatoire dans .env}
        NEXT_PUBLIC_WHATSAPP_ORDER_NUMBER: ${NEXT_PUBLIC_WHATSAPP_ORDER_NUMBER:-}
        NEXT_PUBLIC_TELEGRAM_ORDER_USERNAME: ${NEXT_PUBLIC_TELEGRAM_ORDER_USERNAME:-}
        NEXT_PUBLIC_FACEBOOK_URL: ${NEXT_PUBLIC_FACEBOOK_URL:-}
        NEXT_PUBLIC_INSTAGRAM_URL: ${NEXT_PUBLIC_INSTAGRAM_URL:-}
        NEXT_PUBLIC_TIKTOK_URL: ${NEXT_PUBLIC_TIKTOK_URL:-}
        NEXT_PUBLIC_TELEGRAM_URL: ${NEXT_PUBLIC_TELEGRAM_URL:-}
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    environment:
      # La base est jointe par le nom de service « db ».
      DATABASE_URL: postgresql://${POSTGRES_USER:-restaurant_turc}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD obligatoire dans .env}@db:5432/${POSTGRES_DB:-restaurant_turc}?schema=public
      NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:?NEXT_PUBLIC_SITE_URL obligatoire dans .env}
      NEXT_PUBLIC_WHATSAPP_ORDER_NUMBER: ${NEXT_PUBLIC_WHATSAPP_ORDER_NUMBER:-}
      NEXT_PUBLIC_TELEGRAM_ORDER_USERNAME: ${NEXT_PUBLIC_TELEGRAM_ORDER_USERNAME:-}
      NEXT_PUBLIC_FACEBOOK_URL: ${NEXT_PUBLIC_FACEBOOK_URL:-}
      NEXT_PUBLIC_INSTAGRAM_URL: ${NEXT_PUBLIC_INSTAGRAM_URL:-}
      NEXT_PUBLIC_TIKTOK_URL: ${NEXT_PUBLIC_TIKTOK_URL:-}
      NEXT_PUBLIC_TELEGRAM_URL: ${NEXT_PUBLIC_TELEGRAM_URL:-}
      SESSION_SECRET: ${SESSION_SECRET:?SESSION_SECRET obligatoire dans .env}
      ADMIN_EMAILS: ${ADMIN_EMAILS:?ADMIN_EMAILS obligatoire dans .env}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?ADMIN_PASSWORD obligatoire dans .env}
      DEFAULT_RESTAURANT_SLUG: ${DEFAULT_RESTAURANT_SLUG:-anatolia-grill}
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-}
      STRIPE_CONNECT_COUNTRY: ${STRIPE_CONNECT_COUNTRY:-FR}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      EMAIL_FROM: ${EMAIL_FROM:-}
      RESTAURANT_LATITUDE: ${RESTAURANT_LATITUDE:-48.6908}
      RESTAURANT_LONGITUDE: ${RESTAURANT_LONGITUDE:-2.3738}
      TWILIO_ACCOUNT_SID: ${TWILIO_ACCOUNT_SID:-}
      TWILIO_AUTH_TOKEN: ${TWILIO_AUTH_TOKEN:-}
      TWILIO_SMS_FROM: ${TWILIO_SMS_FROM:-}
      TWILIO_WHATSAPP_FROM: ${TWILIO_WHATSAPP_FROM:-}
      WHATSAPP_ORDER_TO: ${WHATSAPP_ORDER_TO:-}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_ORDER_CHAT_ID: ${TELEGRAM_ORDER_CHAT_ID:-}
      CRON_SECRET: ${CRON_SECRET:-}
      UPSTASH_REDIS_REST_URL: ${UPSTASH_REDIS_REST_URL:-}
      UPSTASH_REDIS_REST_TOKEN: ${UPSTASH_REDIS_REST_TOKEN:-}
    volumes:
      # Médias téléversés depuis le CRM (/admin/medias). Volume nommé — donc
      # conservé lors des `up -d --build` — et hors de `public/`, qui est
      # reconstruit à chaque image. Voir src/lib/media.ts.
      - uploads:/app/.data/uploads
    ports:
      # Exposé uniquement en local (Nginx fait le reverse-proxy).
      # Port hôte 3201 en production lodene.cloud.
      - "127.0.0.1:${APP_HOST_PORT:-3201}:3000"

volumes:
  pgdata:
  uploads:
