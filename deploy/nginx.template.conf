# Modèle de vhost Nginx pour UN restaurant (stratégie multi-instance).
#
# Génère un vhost concret en remplaçant __DOMAIN__ et __PORT__ :
#
#   DOMAIN=lodene.cloud PORT=3201
#   sed -e "s/__DOMAIN__/$DOMAIN/g" -e "s/__PORT__/$PORT/g" \
#     deploy/nginx.template.conf > /etc/nginx/sites-available/$DOMAIN
#   ln -sf ../sites-available/$DOMAIN /etc/nginx/sites-enabled/$DOMAIN
#   nginx -t && systemctl reload nginx
#   certbot --nginx -d $DOMAIN -d www.$DOMAIN   # ajoute le bloc HTTPS 443 automatiquement
#
# Un fichier dédié par restaurant : ne jamais éditer le vhost d'un autre site.
# L'app écoute en local sur 127.0.0.1:__PORT__ (voir deploy/clients/PORTS.md).

server {
    listen 80;
    server_name __DOMAIN__ www.__DOMAIN__;

    # Taille max des requêtes (uploads éventuels).
    client_max_body_size 10M;

    location / {
        proxy_pass http://127.0.0.1:__PORT__;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 60s;
    }

    # Cache long pour les assets statiques Next.
    location /_next/static/ {
        proxy_pass http://127.0.0.1:__PORT__;
        proxy_cache_valid 200 60m;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }
}

# Après obtention du certificat (certbot), un bloc HTTPS (listen 443 ssl)
# est ajouté automatiquement par certbot et redirige le port 80 vers 443.
