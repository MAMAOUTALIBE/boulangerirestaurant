# Reverse proxy Nginx pour restaurant (VPS Hostinger).
# Place : /etc/nginx/sites-available/restaurant → lien dans sites-enabled.
# Remplacer VOTRE-DOMAINE par votre domaine réel.

server {
    listen 80;
    server_name VOTRE-DOMAINE www.VOTRE-DOMAINE;

    # Taille max des requêtes (uploads éventuels).
    client_max_body_size 10M;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 60s;
    }

    # Cache long pour les assets statiques Next.
    location /_next/static/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_cache_valid 200 60m;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }
}

# Après obtention du certificat (certbot), un bloc HTTPS (listen 443 ssl)
# est ajouté automatiquement par certbot et redirige le port 80 vers 443.
